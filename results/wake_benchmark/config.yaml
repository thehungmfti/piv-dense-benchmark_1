# So sánh ofpiv / crosscorr / RAFT-PIV (tái hiện, huấn luyện cho wake) trên dòng wake đáy tù
# Cần checkpoint: checkpoints/raftpiv_wake{,_v2}/best.pt (scripts/train_raftpiv.py)
# Trường wake mặc định theo liên tục trục đối xứng (axisymmetric: true).
name: wake_benchmark
shape: [256, 384]
border: 16
seeds: [0]

synth:
  d_p: 2.5
  ppp: [0.02, 0.05]
  snr: [null, 10]
  intensity_min: 0.6

methods:
  - name: ofpiv
    method: ofpiv
    params: {lambda_HS: 20, lambda_LS: 2000, init: crosscorr}
  - name: ofpiv_warp
    method: ofpiv
    params: {lambda_HS: 20, lambda_LS: 2000, init: crosscorr, shift_method: warp, n_iter: 3}
  - name: crosscorr
    method: crosscorr
    params: {windows: [64, 32, 16], overlap: 0.75, iters_per_window: [1, 1, 2]}
  - name: raftpiv_v1          # 6000 bước, dữ liệu div₂D = 0
    method: raftpiv
    params: {backend: local, iters: 16, checkpoint: checkpoints/raftpiv_wake/best.pt}
  - name: raftpiv             # v2: tinh chỉnh với wake trục đối xứng + trường nén được
    method: raftpiv
    params: {backend: local, iters: 16, checkpoint: checkpoints/raftpiv_wake_v2/best.pt}
  - name: raftpiv_ls          # lai: RAFT-PIV v2 khởi tạo + Liu–Shen tinh chỉnh (warp, 3 lượt)
    method: ofpiv
    params: {lambda_HS: 20, lambda_LS: 2000, init: raftpiv, shift_method: warp, n_iter: 3,
             raft_params: {iters: 16, checkpoint: checkpoints/raftpiv_wake_v2/best.pt}}

fields:
  - name: wake_base           # đáy trong khung, vùng tuần hoàn + lớp cắt
    kind: wake
    params: {D: 140, U_inf: 6.0, x_base: 30, L_r: 1.3, U_rev: 0.3, kh_strength: 0.6, street_strength: 0.3,
             turb_rms: 0.06, seed: 11}
  - name: wake_recirc         # khung đặt ở vùng bám lại
    kind: wake
    params: {D: 140, U_inf: 8.0, x_base: -120, L_r: 1.2, U_rev: 0.25, kh_strength: 0.8, street_strength: 0.5,
             turb_rms: 0.08, seed: 12}
  - name: wake_far            # wake xa, mode so le
    kind: wake
    params: {D: 110, U_inf: 8.0, x_base: -380, L_r: 1.3, U_rev: 0.2, kh_strength: 0.3, street_strength: 0.8,
             turb_rms: 0.1, seed: 13}
  - name: sine
    kind: sine
    params: {amplitude: 0.5}
    wavelengths: [4, 6, 8, 12, 16, 24, 32, 48, 64, 128, 256]
  - name: cai                 # ảnh thật từ bộ test Cai et al. (wake trụ tròn, bậc lùi)
    kind: cai
    params: {root: ../data_cai, classes: [cylinder, backstep], split: test, n: 8}

metrics:
  mtf_thresholds: [0.9, 0.5]
  gradient_mask: {quantity: vorticity, top_percent: 10}
