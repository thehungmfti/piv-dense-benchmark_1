[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pivbench"
version = "0.1.0"
description = "Benchmark dense (1 vector/pixel) PIV methods against DNS ground truth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "imageio>=2.30",
    "tifffile>=2023.1",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
openpiv = ["openpiv>=0.25"]
dev = ["pytest>=7.4"]
all = ["torch>=2.1", "openpiv>=0.25", "pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
